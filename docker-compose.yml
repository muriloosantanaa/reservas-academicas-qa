services:
  postgres:
    image: postgres:16-alpine
    container_name: reservas-academicas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: reservas_academicas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - reservas_academicas_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservas_academicas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reservas_academicas_data:
