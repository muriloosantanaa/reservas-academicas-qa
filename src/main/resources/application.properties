spring.application.name=reservas-academicas
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservas_academicas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Erros nunca expõem mensagem interna, stack trace ou detalhes de binding
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Integração externa de notificação (desligada quando vazio)
notificacao.webhook.url=${NOTIFICACAO_WEBHOOK_URL:}
notificacao.webhook.timeout-ms=${NOTIFICACAO_WEBHOOK_TIMEOUT_MS:2000}

# Restrições de exclusão no PostgreSQL (defesa em profundidade contra dupla reserva)
reservas.restricoes-banco.habilitado=${RESTRICOES_BANCO_HABILITADO:true}
